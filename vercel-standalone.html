<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Talleria · Gestión de flota</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17231f;--green:#075244;--soft:#e9f4f0;--line:#dfe6e3;--muted:#708079;--amber:#bb741b}
    *{box-sizing:border-box}body{margin:0;background:#fff}button,input{font:inherit;color:inherit}
    .app{display:grid;grid-template-columns:145px minmax(650px,1fr)320px;height:100vh;overflow:hidden}
    aside{background:#005346;color:#fff;display:flex;flex-direction:column}.brand{height:64px;padding:18px 20px;background:#f8faf9;color:#043f34;font-size:25px;font-weight:750}
    nav{padding:14px 8px}.nav{width:100%;height:52px;border:0;border-radius:6px;background:transparent;color:#eff8f5;text-align:left;padding:0 14px;cursor:pointer}.nav.active{background:rgba(255,255,255,.13);border-left:3px solid #80c8b2}.navfoot{margin-top:auto;padding:10px 8px 18px;border-top:1px solid rgba(255,255,255,.15)}
    main{min-width:0;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line)}.top strong{font-size:20px}.profile{display:flex;align-items:center;gap:9px;font-size:12px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#064b3f;color:#fff}
    .summary{height:132px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border-bottom:1px solid var(--line)}.summary div{padding:10px 36px;border-right:1px solid var(--line)}.summary span{display:block;font-size:11px;margin-bottom:8px}.summary strong{font-size:34px;color:#08705d;font-weight:500}.summary small{margin-left:8px;color:var(--muted)}
    .tools{height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line)}.search{width:300px;height:38px;padding:0 12px;border:1px solid #ccd7d3;border-radius:5px}.filters{display:flex;gap:10px}.filters button{height:38px;padding:0 16px;border:1px solid #d4ddda;border-radius:5px;background:#fff;cursor:pointer}.filters button.active{background:#edf6f3;border-color:#8eaaa1}
    .tablebox{min-height:0;flex:1;display:flex;flex-direction:column;overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px}th{height:58px;padding:8px;text-align:left;background:#f8faf9;font-weight:550}td{height:71px;padding:9px 8px;border-bottom:1px solid #e4eae7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th:first-child,td:first-child{padding-left:18px}tbody tr{cursor:pointer}tbody tr:hover{background:#f7fbf9}tbody tr.selected{background:#eaf4f0;box-shadow:inset 0 1px #a8c9be,inset 0 -1px #a8c9be}td strong,td small{display:block}td small{margin-top:5px;color:var(--muted);font-size:9px}.badge{display:inline-flex;padding:5px 7px;border-radius:999px;background:#e8f4f0;color:#08705d;font-size:8px;font-weight:650}.badge.dom{background:#eff1f2;color:#606a66}.status{color:#13825b}.status.warn{color:var(--amber)}.foot{margin-top:auto;display:flex;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}
    .inspector{color:#17231f;background:#fff;border-left:1px solid var(--line);overflow:auto}.head{padding:20px 16px 12px;color:#17231f}.head strong{display:block;font-size:19px;font-weight:550}.head span{display:block;margin:7px 0;color:var(--muted);font-size:11px}.drivers{padding:11px 16px;background:#f7faf9;border-block:1px solid var(--line);font-size:9px;color:#33423c}.tabs{display:flex;height:44px;padding:0 16px;border-bottom:1px solid var(--line)}.tabs button{width:80px;border:0;border-bottom:2px solid transparent;background:transparent;font-size:10px}.tabs .active{color:var(--green);border-color:var(--green);font-weight:650}
    .turns{padding:16px 13px}.turntitle{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}.turntitle strong{font-size:11px}.turntitle small{display:block;margin-top:5px;color:var(--muted);font-size:8px}.complete{padding:5px 7px;border-radius:999px;background:#e7f5f0;color:#087452;font-size:8px}
    .shift{margin-bottom:9px;border:1px solid #d9e1de;border-radius:7px;overflow:hidden}.shift.alert{border-color:#efc27f}.toggle{width:100%;min-height:62px;display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:8px;padding:10px;border:0;background:#fff;text-align:left;cursor:pointer}.toggle span{display:flex;flex-direction:column;gap:4px}.toggle strong{font-size:10px}.toggle small{color:var(--muted);font-size:8px}.toggle .right{text-align:right;color:var(--green)}.details{display:none;padding:10px;border-top:1px solid #e7ecea;background:#fbfcfc}.shift.open .details{display:block}.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e0e7e4;border-radius:5px;background:#fff}.metric{padding:8px;border-bottom:1px solid #e7ecea}.metric:nth-child(odd){border-right:1px solid #e7ecea}.metric:nth-last-child(-n+2){border-bottom:0}.metric small,.metric strong{display:block}.metric small{font-size:7px;color:var(--muted);margin-bottom:5px}.metric strong{font-size:9px}.alertbox{margin-top:9px;padding:8px;background:#fff2dc;color:#9c5d12;font-size:8px}.proof{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:8px}.proof button{height:27px;border:1px solid #8fbaac;border-radius:4px;background:#fff;color:var(--green);font-size:8px}
    .domestic{padding:35px 20px;text-align:center}.domestic h2{font-size:14px}.domestic p{color:var(--muted);font-size:10px;line-height:1.5}.domestic .reading{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:6px;text-align:left}.domestic .reading strong{display:block;margin-top:5px;font-size:18px}.service{padding:17px 16px;border-top:1px solid var(--line);font-size:9px}.service strong{display:block;margin-bottom:6px;color:var(--amber)}
    @media(max-width:900px){.app{display:block;height:auto;overflow:visible}.app>aside{display:none}main{min-height:100vh}.inspector{border-left:0;border-top:1px solid var(--line)}table{min-width:820px}.tablebox{overflow-x:auto}.summary div{padding:10px 20px}}@media(max-width:620px){.summary{height:auto;grid-template-columns:1fr}.summary div{min-height:90px;border-bottom:1px solid var(--line)}.tools{height:auto;align-items:stretch;flex-direction:column}.search{width:100%}.filters{overflow:auto}}
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand">Talleria</div><nav><button class="nav active">Flota</button><button class="nav">Lecturas</button><button class="nav">Facturas</button><button class="nav">Mantenimiento</button><button class="nav">Automatizaciones</button></nav><div class="navfoot"><button class="nav">Ajustes</button><button class="nav">Ayuda</button></div></aside>
  <main><header class="top"><strong>Flota</strong><div class="profile"><span>27 jul 2026</span><span class="avatar">AG</span><span><b>Ana García</b><br>Gestora de flota</span></div></header>
    <section class="summary"><div><span>Vehículos profesionales</span><strong>3</strong><small>6 turnos hoy</small></div><div><span>Uso doméstico</span><strong>2</strong><small>2 conductores/coche</small></div><div><span>Combustible · hoy</span><strong>104,3 L</strong><small>177,31 €</small></div></section>
    <section class="tools"><input class="search" id="search" placeholder="Buscar matrícula o conductor"><div class="filters"><button class="active" data-filter="Todos">Todos</button><button data-filter="Profesional">Profesional</button><button data-filter="Doméstico">Doméstico</button></div></section>
    <section class="tablebox"><table><thead><tr><th>Matrícula</th><th>Vehículo</th><th>Uso</th><th>Conductores</th><th>Km acumulados</th><th>Km hoy</th><th>Combustible</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table><div class="foot"><span>5 vehículos · 10 conductores</span><span>Datos actualizados por WhatsApp</span></div></section>
  </main>
  <section class="inspector" id="inspector"></section>
</div>
<script>
const vehicles=[
 {p:"1234 KXD",m:"Ford Transit",u:"Profesional",d:["Luis Martínez","Elena Torres"],o:"128.460 km",k:"318 km",f:"38,5 L",s:"Al día",service:"12 ago 2026 · 134.000 km",sh:[["Turno de tarde","Elena Torres","14:10–22:04","128.310 km","128.460 km","150 km","18,4 L","12,3 L/100","31,28 €"],["Turno de mañana","Luis Martínez","06:03–14:01","128.142 km","128.310 km","168 km","20,1 L","12 L/100","34,17 €"]]},
 {p:"5678 LPT",m:"Mercedes Sprinter",u:"Profesional",d:["Carlos Pérez","Marta Sánchez"],o:"142.980 km",k:"276 km",f:"34,2 L",s:"Al día",service:"18 ago 2026 · 150.000 km",sh:[["Turno de tarde","Marta Sánchez","14:02–21:46","142.842 km","142.980 km","138 km","16,8 L","12,2 L/100","28,56 €"],["Turno de mañana","Carlos Pérez","06:08–13:55","142.704 km","142.842 km","138 km","17,4 L","12,6 L/100","29,58 €"]]},
 {p:"9102 JBV",m:"Renault Master",u:"Profesional",d:["Javier Ruiz","Laura Gómez"],o:"210.735 km",k:"241 km",f:"31,6 L",s:"Consumo alto",service:"2 ago 2026 · 215.000 km",alert:1,sh:[["Turno de tarde","Laura Gómez","14:06–21:58","210.614 km","210.735 km","121 km","19,2 L","15,9 L/100","32,64 €"],["Turno de mañana","Javier Ruiz","06:11–13:57","210.494 km","210.614 km","120 km","12,4 L","10,3 L/100","21,08 €"]]},
 {p:"3456 HTR",m:"Peugeot 3008",u:"Doméstico",d:["Ana García","David García"],o:"98.215 km",k:"34 km",f:"—",s:"Al día",service:"22 ago 2026 · 105.000 km",sh:[]},
 {p:"7890 GYL",m:"Toyota Corolla",u:"Doméstico",d:["Sergio Ruiz","María Ruiz"],o:"75.840 km",k:"18 km",f:"—",s:"Próxima revisión",service:"6 ago 2026 · 80.000 km",sh:[]}
];let selected="9102 JBV",filter="Todos";
function render(){const q=document.querySelector("#search").value.toLowerCase();document.querySelector("#rows").innerHTML=vehicles.filter(v=>(filter==="Todos"||v.u===filter)&&(`${v.p} ${v.m} ${v.d.join(" ")}`.toLowerCase().includes(q))).map(v=>`<tr data-p="${v.p}" class="${v.p===selected?"selected":""}"><td><b>${v.p}</b></td><td><strong>${v.m}</strong><small>${v.sh.length?"2 turnos recibidos":"Uso particular"}</small></td><td><span class="badge ${v.u==="Doméstico"?"dom":""}">${v.u}</span></td><td><strong>${v.d[0]}</strong><small>${v.d[1]}</small></td><td><strong>${v.o}</strong><small>Actualizado hoy</small></td><td><b>${v.k}</b></td><td><strong>${v.f}</strong><small>${v.f==="—"?"Sin repostaje":"Acumulado del día"}</small></td><td><span class="status ${v.s==="Al día"?"":"warn"}">● ${v.s}</span></td></tr>`).join("");document.querySelectorAll("tbody tr").forEach(r=>r.onclick=()=>{selected=r.dataset.p;render();});renderInspector()}
function renderInspector(){const v=vehicles.find(x=>x.p===selected);let content=`<div class="head"><strong>${v.p}</strong><span>${v.m}</span><b class="badge ${v.u==="Doméstico"?"dom":""}">${v.u}</b></div><div class="drivers"><b>${v.d.join(" · ")}</b><br>Conductores asignados</div><div class="tabs"><button class="active">Turnos</button><button>Vehículo</button></div>`;if(v.sh.length){content+=`<div class="turns"><div class="turntitle"><span><strong>Turnos de hoy</strong><small>2 de 2 recibidos · 27 jul 2026</small></span><b class="complete">✓ Completo</b></div>${v.sh.map((s,i)=>`<article class="shift ${i===0?"open":""} ${i===0&&v.alert?"alert":""}"><button class="toggle"><span><strong>${s[0]}</strong><small>${s[1]} · ${s[2]}</small></span><span class="right"><strong>${s[5]}</strong><small>${s[6]}</small></span><b>⌄</b></button><div class="details"><div class="metrics">${["Km inicio",s[3],"Total acumulado",s[4],"Km del turno",s[5],"Combustible",s[6],"Consumo medio",s[7],"Coste",s[8]].reduce((a,x,j)=>a+(j%2===0?`<div class="metric"><small>${x}</small>`:`<strong>${x}</strong></div>`),"")}</div>${i===0&&v.alert?`<div class="alertbox"><b>Consumo superior al habitual</b><br>Revisar antes de cerrar el turno.</div>`:""}<div class="proof"><span><b>Lectura recibida por WhatsApp</b><br>Confianza IA ${i?98:96}%</span><button>Validar</button></div></div></article>`).join("")}</div>`}else{content+=`<div class="domestic"><h2>Vehículo de uso doméstico</h2><p>No requiere partes por turno. El kilometraje se actualiza cuando cualquiera de los dos conductores envía una lectura.</p><div class="reading"><small>Última lectura</small><strong>${v.o}</strong><small>Hoy · 18:42</small></div></div>`}content+=`<div class="service"><strong>Próxima revisión</strong>${v.service}<br><small>Seguimiento automático por fecha y kilometraje.</small></div>`;document.querySelector("#inspector").innerHTML=content;document.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"))}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelector("#search").oninput=render;render();
</script>
</body></html>
